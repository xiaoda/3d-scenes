<svg xmlns="http://www.w3.org/2000/svg" width="960" height="790" viewBox="0 0 960 790" role="img" aria-labelledby="title desc"><title id="title">榆叶酒馆街角，20 × 30 米原创平面提案</title><desc id="desc">四栋建筑围合主街与小院落。由南端入场，沿五米宽主街靠近西侧酒馆，再转入北部院落。C1 入场、C2 近看、C3 回望、C4 转身。仅为 P0 设计，不是实地测绘或可行走场景。</desc><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#526250" stroke-opacity=".11" stroke-width=".6"/></pattern><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V8" stroke="#718065" stroke-opacity=".1" stroke-width="2"/></pattern><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#9d6349"/></marker><style>text{font-family:'Microsoft YaHei',sans-serif;fill:#334236}.bid{text-anchor:middle;font:700 22px Georgia,serif}.bn{text-anchor:middle;font-size:14px}.dim{text-anchor:middle;font-size:12px;fill:#4b5546}.label{font-size:15px}.small{font-size:13px;fill:#67715e}.camera{fill:#fffaf0}.title{font:700 23px 'Microsoft YaHei',sans-serif}</style></defs><rect width="960" height="790" fill="#f7f5ec"/><text x="100" y="27" class="small">原创空间设计 · 所有尺寸为美术初值 · 非实地测绘</text><rect x="100" y="80" width="400" height="600" fill="#e7eadf"/><rect x="100" y="80" width="400" height="600" fill="url(#hatch)"/><rect x="240" y="420" width="100" height="240" fill="#e2d7bd"/><rect x="240" y="250" width="240" height="170" fill="#e2d7bd"/><rect x="100" y="80" width="400" height="600" fill="url(#grid)"/><rect x="100" y="80" width="400" height="600" fill="none" stroke="#73816c" stroke-width="1.5" stroke-dasharray="5 5"/><g><rect x="120" y="300" width="120" height="200" fill="#bb9178" stroke="#586153" stroke-width="1.7"/><path d="M 180 308 V 492" stroke="#65684f" stroke-opacity=".45"/><text x="180" y="388" class="bid">A</text><text x="180" y="410" class="bn">榆叶酒馆</text><text x="180" y="430" class="dim">6 × 10 m</text></g><g><rect x="340" y="420" width="140" height="200" fill="#b4b295" stroke="#586153" stroke-width="1.7"/><path d="M 410 428 V 612" stroke="#65684f" stroke-opacity=".45"/><text x="410" y="508" class="bid">B</text><text x="410" y="530" class="bn">工坊住宅</text><text x="410" y="550" class="dim">7 × 10 m</text></g><g><rect x="220" y="120" width="180" height="120" fill="#a5ada0" stroke="#586153" stroke-width="1.7"/><path d="M 310 128 V 232" stroke="#65684f" stroke-opacity=".45"/><text x="310" y="168" class="bid">C</text><text x="310" y="190" class="bn">院后住宅</text><text x="310" y="210" class="dim">9 × 6 m</text></g><g><rect x="120" y="120" width="80" height="120" fill="#c4c7b9" stroke="#586153" stroke-width="1.7"/><path d="M 160 128 V 232" stroke="#65684f" stroke-opacity=".45"/><text x="160" y="168" class="bid">D</text><text x="160" y="190" class="bn">小仓房</text><text x="160" y="210" class="dim">4 × 6 m</text></g><path d="M240 505V662H340 M480 250V420" fill="none" stroke="#697662" stroke-width="5"/><path d="M276 662H310" stroke="#ad815c" stroke-width="6"/><path d="M240 386V412" stroke="#f7f5ec" stroke-width="7"/><path d="M340 529V551" stroke="#f7f5ec" stroke-width="7"/><path d="M249 388V409" stroke="#86654f" stroke-width="3"/><text x="344" y="276" class="label">小院落</text><text x="344" y="297" class="small">转角后展开视野</text><path d="M 290 640 L 290 540 L 290 440 L 310 340 L 420 320" fill="none" stroke="#9d6349" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 290 620 L 256.88402990515203 567.5849971413038 L 297.20811325073095 558.4204327445813 Z" fill="#446859" opacity=".16"/><circle cx="290" cy="620" r="13" fill="#284c3b" stroke="#fffaf0" stroke-width="2"/><text x="290" y="624" class="camera" text-anchor="middle" font-size="11" font-family="sans-serif">C1</text><path d="M 310 400 L 251.54921073724253 420.6761997127305 L 251.54921073724253 379.32380028726953 Z" fill="#446859" opacity=".16"/><circle cx="310" cy="400" r="13" fill="#284c3b" stroke="#fffaf0" stroke-width="2"/><text x="310" y="404" class="camera" text-anchor="middle" font-size="11" font-family="sans-serif">C2</text><path d="M 420 320 L 374.9843937808664 362.6332639698616 L 358.1895937105802 324.8449638117177 Z" fill="#446859" opacity=".16"/><circle cx="420" cy="320" r="13" fill="#284c3b" stroke="#fffaf0" stroke-width="2"/><text x="420" y="324" class="camera" text-anchor="middle" font-size="11" font-family="sans-serif">C3</text><path d="M 290 460 L 338.51223864127667 498.6078062315359 L 303.44547406194476 520.5245340936184 Z" fill="#446859" opacity=".16"/><circle cx="290" cy="460" r="13" fill="#284c3b" stroke="#fffaf0" stroke-width="2"/><text x="290" y="464" class="camera" text-anchor="middle" font-size="11" font-family="sans-serif">C4</text><path d="M100 62V47M500 62V47M100 54H500" stroke="#53644e"/><text x="300" y="47" class="dim">20 m</text><path d="M78 80H65M78 680H65M71 80V680" stroke="#53644e"/><text x="50" y="380" transform="rotate(-90 50 380)" class="dim">30 m</text><text x="289" y="688" class="small" text-anchor="middle">入口门 · 返回起点</text><text x="100" y="706" class="small">主街宽 5 m · 净空待资产落地复核</text><path d="M100 725H200M100 721V729M150 721V729M200 721V729" stroke="#334236" stroke-width="2"/><text x="100" y="748" class="small">0</text><text x="187" y="748" class="small">5 m</text><text x="250" y="733" class="small">每格 1 m</text><text x="250" y="754" class="small">浅色区域为建议可达区</text><path d="M551 132V82L541 104M551 82L561 104" fill="none" stroke="#334236" stroke-width="2"/><text x="546" y="66" class="label">北</text><text x="596" y="96" class="title">先走一段街，再发现院落。</text><text x="596" y="126" class="small">不是固定导览；虚线只表示建议观察顺序。</text><text x="563" y="193" class="label">A / 酒馆是主角</text><text x="563" y="217" class="small">东立面、门框、招牌、石阶重点精修。</text><text x="563" y="260" class="label">B—D / 配角建立空间</text><text x="563" y="284" class="small">共享材质和建筑模块，不追加三套独立风格。</text><text x="563" y="333" class="label">四个验收视角</text><text x="563" y="362" class="small">C1　入场：石路引导至酒馆入口</text><text x="563" y="391" class="small">C2　近看：门框厚度、木梁、灰泥、石阶</text><text x="563" y="420" class="small">C3　回望：院落围合与酒馆另一侧构图</text><text x="563" y="449" class="small">C4　转身：反方向工坊立面与街道完整性</text><path d="M661 625L600 554" stroke="#b68047" stroke-width="3" marker-end="url(#arrow)"/><circle cx="675" cy="642" r="14" stroke="#b68047" stroke-width="2" fill="none"/><text x="563" y="514" class="label">光从东南侧进入</text><text x="563" y="539" class="small">高度约 35°；暖日光，背光面保持可读。</text><text x="707" y="647" class="small">美术初值</text><text x="563" y="708" class="label">不开放室内 · 不制作整座城镇</text><text x="563" y="736" class="small">建筑／院墙／入口门负责遮挡未制作区域。</text><text x="563" y="764" class="small">P0 只定方向；可达性、碰撞与画质尚未验证。</text></svg>